name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin manifest JSON
        run: |
          for f in .claude-plugin/*.json; do
            echo "Validating $f"
            python3 -m json.tool "$f" > /dev/null
          done
